<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Mr.Clean Car Detailing</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><span class="logo" data-logo></span><span class="brand-text"><b data-business-name>Mr.Clean Car Detailing</b><small data-tagline>&amp; PPF Ceramic Coating</small><span class="brand-badge" data-role-badge>ADMIN</span></span></div>
      <nav class="nav">
        <a href="#/"><span class="icon">📊</span> Dashboard</a>
        <a href="#/bookings"><span class="icon">📅</span> Bookings</a>
        <a href="#/vehicles"><span class="icon">🚗</span> Vehicles &amp; history</a>
        <a href="#/customers" data-admin-only><span class="icon">👥</span> Customers</a>
        <a href="#/inventory"><span class="icon">📦</span> Inventory</a>
        <a href="#/services" data-admin-only><span class="icon">🧽</span> Services &amp; pricing</a>
        <a href="#/staff" data-admin-only><span class="icon">🧑‍🔧</span> Staff</a>
        <a href="#/reports" data-admin-only><span class="icon">📈</span> Reports</a>
        <a href="#/settings" data-admin-only><span class="icon">⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <div class="who" data-user-name></div>
        <div data-user-email></div>
        <button class="btn btn-sm" data-logout>Sign out</button>
      </div>
    </aside>
    <div>
      <header class="topbar">
        <button class="btn btn-sm" data-nav-toggle aria-label="Menu">☰</button>
        <span class="logo" data-logo></span><strong data-business-name>Mr.Clean Car Detailing</strong>
      </header>
      <main class="main" id="main"><div class="loading">Loading…</div></main>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
